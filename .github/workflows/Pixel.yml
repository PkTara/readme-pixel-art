name: Pixel

on:
  issues:
    types: [opened]

jobs:
  paint:
    permissions:
      issues: write
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'Pixel:')
    # No concurrency group: GitHub only keeps one pending run per group and cancels
    # the rest, which would drop paints. main.py retries the push on conflicts instead.

    steps:
      - uses: actions/checkout@v4

      - name: Setting up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # main.py commits and pushes itself, rebasing onto the latest canvas and
      # retrying if another paint was pushed first
      - name: Paint pixel
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          pip install -r requirements.txt
          python main.py
