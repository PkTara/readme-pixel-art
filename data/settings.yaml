comments:
  frog_ribbet: "RIBBET! {author}"

  # Message displayed after a pixel is painted. {pixel} is the coordinate (C4 for example), {colour} the colour name
  successful_paint: |-
      {author} done! Painted pixel `{pixel}` {colour}.
      Thanks for contributing!

  # Message displayed when the pixel coordinate in the title is outside the canvas
  invalid_pixel: "{author} Sorry, `{pixel}` isn't a pixel on the canvas. Please click a pixel in the README and don't change the issue title!"

  # Message displayed when no valid colour could be read from the issue
  invalid_colour: "{author} Sorry, I couldn't figure out which colour you picked. Please try again and choose one from the dropdown!"

  # Error message shown after an invalid command to the bot
  unknown_command: "{author} Sorry, I can't understand the command. Please try again and do not modify the issue title!"

issues:
  link: "https://github.com/{repo}/issues/new?{params}"
  paint:
    template: "paint-pixel.yml"
    title: "Pixel: Paint {pixel}"

canvas:
  width: 8
  height: 8
  # Size (in px) each pixel is drawn at in the README
  pixel_size: 40
  default_colour: white

# Colours offered in the issue form. Names must match the dropdown options in
# .github/ISSUE_TEMPLATE/paint-pixel.yml and the images in img/pixels/
palette:
  white: "#ffffff"
  black: "#000000"
  grey: "#9e9e9e"
  red: "#e53935"
  orange: "#fb8c00"
  yellow: "#fdd835"
  green: "#43a047"
  cyan: "#00acc1"
  blue: "#1e88e5"
  purple: "#8e24aa"
  pink: "#f06292"
  brown: "#6d4c41"

markers:
  canvas:
    begin: "<!-- BEGIN CANVAS -->\n"
    end: "<!-- END CANVAS -->\n"
  last_paints:
    begin: "<!-- BEGIN LAST PAINTS -->\n"
    end: "<!-- END LAST PAINTS -->\n"
  top_painters:
    begin: "<!-- BEGIN TOP PAINTERS -->\n"
    end: "<!-- END TOP PAINTERS -->\n"

misc:
  # Maximum number of last paints displayed
  max_last_paints: 5
  # Maximum number of top painters displayed
  max_top_painters: 10
